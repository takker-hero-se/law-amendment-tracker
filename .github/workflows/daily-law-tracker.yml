name: daily-law-tracker

# 毎日 06:00 JST（21:00 UTC）に e-Gov の差分を取り込み、要約を生成し、サイトをビルドして配信する。
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "この公布日以降の改正だけを対象にする (YYYY-MM-DD)。空なら前回スナップショットとの差分"
        required: false
        default: ""
      limit:
        description: "1 回に処理する最大件数"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: daily-law-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 既定は LLM を使わない template。ANTHROPIC_API_KEY か GEMINI_API_KEY を Secrets に置いたら provider を切り替える。
      LAWTRACK_LLM_PROVIDER: ${{ vars.LAWTRACK_LLM_PROVIDER || 'template' }}
      LAWTRACK_ANTHROPIC_MODEL: ${{ vars.LAWTRACK_ANTHROPIC_MODEL || 'claude-haiku-5-5' }}
      LAWTRACK_GEMINI_MODEL: ${{ vars.LAWTRACK_GEMINI_MODEL || 'gemini-2.5-flash' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LAWTRACK_MAX_EVENTS_PER_RUN: ${{ github.event.inputs.limit || '30' }}
      LAWTRACK_REQUEST_INTERVAL_SEC: "0.5"
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Detect, summarize, generate
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.since }}" ]; then ARGS="--since ${{ github.event.inputs.since }}"; fi
          python -m pipeline.run $ARGS | tee pipeline-report.txt

      - name: Commit generated content
        id: commit
        run: |
          git config user.name "law-tracker-bot"
          git config user.email "law-tracker-bot@users.noreply.github.com"
          git add frontend/src/content/amendments data/state.json
          # 書き込み・除外ともに 0 件なら state.json は last_run_at しか変わらないので、空コミットを積まない
          if git diff --cached --quiet || grep -qE " dropped=0 written=0 " pipeline-report.txt; then
            git reset -q
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(content): $(date -u +%Y-%m-%d) $(cat pipeline-report.txt)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build site
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        if: ${{ vars.CF_PAGES_PROJECT != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=${{ vars.CF_PAGES_PROJECT }} --commit-dirty=true

      - name: Upload site artifact (GitHub Pages fallback)
        if: ${{ vars.CF_PAGES_PROJECT == '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  pages:
    # Cloudflare を使わない場合は GitHub Pages に配信する（リポジトリ設定で Pages の Source を "GitHub Actions" にする）。
    needs: track
    if: ${{ vars.CF_PAGES_PROJECT == '' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
